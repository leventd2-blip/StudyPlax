<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPlax | Low-Poly Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white text-black font-mono">
    <header class="border-b-4 border-black p-6 flex justify-between items-center bg-white">
        <h1 class="text-2xl font-extrabold tracking-widest">STUDYPLAX_</h1>
        <nav class="space-x-6 text-sm font-bold">
            <a href="index.html" class="bg-black text-white px-3 py-1">Dashboard</a>
            <a href="decks.html" class="hover:underline">Decks</a>
            <a href="stats.html" class="hover:underline">Stats</a>
            <a href="settings.html" class="hover:underline">Settings</a>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto p-8 mt-12">
        <section class="border-4 border-black p-8 mb-12 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] bg-white">
            <h2 class="text-xl font-bold mb-4 tracking-tight">ACTIVE REVIEW PIPELINE</h2>
            <p class="text-sm mb-6 font-medium">You have <span id="queue-count" class="font-bold underline">24</span> low-poly cards due for spatial recall today.</p>
            <a href="study.html" class="inline-block border-2 border-black px-6 py-3 font-extrabold bg-black text-white hover:bg-white hover:text-black transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">INITIALIZE SESSION &rarr;</a>
        </section>

        <section class="grid grid-cols-2 gap-6">
            <div class="border-4 border-black p-6 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
                <h3 class="font-bold text-sm tracking-widest mb-2">ACTIVE DECKS</h3>
                <p class="text-4xl font-black" id="stat-decks">12</p>
            </div>
            <div class="border-4 border-black p-6 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
                <h3 class="font-bold text-sm tracking-widest mb-2">RETENTION INDEX</h3>
                <p class="text-4xl font-black" id="stat-retention">94.8%</p>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
