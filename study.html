<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPlax | Study Session</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white text-black font-mono flex flex-col min-h-screen">
    <header class="border-b-4 border-black p-6 flex justify-between items-center bg-white">
        <a href="index.html" class="font-extrabold hover:underline">&larr; ABORT SESSION</a>
        <span class="text-sm font-bold" id="card-progress">Card 1 of 24</span>
    </header>
    <main class="flex-grow flex flex-col items-center justify-center p-6">
        <div id="flashcard" class="w-full max-w-xl h-96 border-4 border-black p-8 flex flex-col justify-between cursor-pointer shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] bg-white relative transition-all select-none">
            <div class="flex justify-between text-xs font-extrabold border-b-2 border-black pb-3">
                <span id="card-side-indicator">VERTEX: FRONT</span>
                <span>[CLICK TO ROTATE MESH]</span>
            </div>
            <div class="my-auto text-center px-4">
                <p id="card-content" class="text-2xl font-black leading-snug">What is the optimal spatial complexity of an in-place QuickSort partition?</p>
            </div>
            <div class="text-xs text-center font-bold tracking-widest border-t-2 border-black pt-2">STUDYPLAX_LOWPOLY_ENGINE</div>
        </div>
        <div class="flex space-x-6 mt-10">
            <button onclick="handleResponse('again')" class="border-2 border-black px-6 py-3 font-bold bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-black hover:text-white transition-all">AGAIN (1D)</button>
            <button onclick="handleResponse('good')" class="border-2 border-black px-6 py-3 font-bold bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-black hover:text-white transition-all">GOOD (3D)</button>
            <button onclick="handleResponse('easy')" class="border-2 border-black px-6 py-3 font-bold bg-black text-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-white hover:text-black transition-all">EASY (7D)</button>
        </div>
    </main>
    <script src="study.js"></script>
</body>
</html>
